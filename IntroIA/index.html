<!DOCTYPE html>
<html lang="fr-CA">

<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction à l'intelligence artificielle · IntroIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Plan : carnet de laboratoire numérique. Barre latérale = table des matières; contenu = pages du carnet sur papier quadrillé discret. */
:root{
  --paper:#f7f5fa;
  --sheet:#ffffff;
  --ink:#14212b;
  --muted:#5b6b77;
  --rule:#e3dded;
  --accent:#6a3fb5;
  --accent-soft:#f0eafa;
  --signal:#b4530b;
  --signal-soft:#fbeee2;
  --ok:#2f7a4a;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f171d;--sheet:#152129;--ink:#e3eaef;--muted:#93a4b0;--rule:#26353f;
    --accent:#b79cf0;--accent-soft:#2a2140;--signal:#f0a061;--signal-soft:#3a2617;--ok:#6cc48d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f171d;--sheet:#152129;--ink:#e3eaef;--muted:#93a4b0;--rule:#26353f;
  --accent:#b79cf0;--accent-soft:#2a2140;--signal:#f0a061;--signal-soft:#3a2617;--ok:#6cc48d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;
}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:var(--font-mono);font-size:.92em;background:var(--accent-soft);padding:.05em .35em;border-radius:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2.1rem;letter-spacing:-.01em}
h2{font-size:1.45rem;margin-top:2rem}
h3{font-size:1.1rem;margin-top:1.4rem}
p{margin:.6rem 0}

.shell{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sheet);border-right:1px solid var(--rule);
  padding:1.4rem 1rem 2rem;display:flex;flex-direction:column;gap:1.2rem;
}
.brand{display:flex;flex-direction:column;gap:.1rem;text-decoration:none;color:var(--ink)}
.brand .code{font-family:var(--font-mono);font-size:.8rem;color:var(--accent)}
.brand .name{font-family:var(--font-display);font-size:1.25rem;font-weight:700}
.brand .school{font-size:.8rem;color:var(--muted)}
.navwrap{display:flex;flex-direction:column;gap:1.2rem}
.navgroup{display:flex;flex-direction:column;gap:.1rem}
.navgroup .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .3rem .5rem}
.navgroup a{
  display:flex;gap:.6rem;align-items:baseline;text-decoration:none;color:var(--ink);
  padding:.32rem .5rem;border-radius:6px;font-size:.92rem;
}
.navgroup a .n{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);min-width:1.6rem;font-variant-numeric:tabular-nums}
.navgroup a:hover{background:var(--accent-soft)}
.navgroup a[aria-current="page"]{background:var(--accent);color:#fff}
.navgroup a[aria-current="page"] .n{color:#fff}
.navgroup a.draft{color:var(--muted)}

main{padding:2.4rem clamp(16px,4vw,3.5rem) 4rem;max-width:960px;width:100%}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:clamp(1.2rem,3vw,2.2rem)}
.eyebrow{font-family:var(--font-mono);font-size:.8rem;color:var(--accent);margin-bottom:.4rem}
.lead{font-size:1.08rem;color:var(--muted);max-width:65ch}
.prose{max-width:68ch}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}
.step{border:1px solid var(--rule);border-radius:8px;padding:1rem;background:var(--paper)}
.step .when{font-family:var(--font-mono);font-size:.78rem;color:var(--signal)}
.step h3{margin:.2rem 0 .3rem}
.step p{margin:0;font-size:.93rem}

.week{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;border-left:4px solid var(--signal);background:var(--signal-soft);padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-top:1.6rem}
.week .wk{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--signal)}
.week .txt{flex:1;min-width:220px}

.btn{
  display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:600;
  background:var(--accent);color:#fff;padding:.6rem 1rem;border-radius:7px;border:0;font-size:.95rem;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn svg{width:18px;height:18px}

.tablewrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.exam td{background:var(--signal-soft)}
tr.module td{background:var(--paper-2,#f0eafa);color:var(--accent,#6a3fb5);font-family:"IBM Plex Sans Condensed",sans-serif;letter-spacing:.02em;padding-top:1rem}
tr.relache td{background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px);color:var(--muted,#667);font-style:italic}
.pill{display:inline-block;font-family:var(--font-mono);font-size:.75rem;padding:.08rem .5rem;border-radius:99px;white-space:nowrap}
.pill.eval{background:var(--signal);color:#fff}
.pill.form{background:var(--accent-soft);color:var(--accent)}

.chapter-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.status{font-family:var(--font-mono);font-size:.78rem;padding:.15rem .6rem;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.status.ready{border-color:var(--ok);color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.card{border:1px solid var(--rule);border-radius:8px;padding:1rem 1.1rem;background:var(--paper)}
.card h3{margin-top:0}
.card ul,.card ol{margin:.4rem 0 0;padding-left:1.2rem}
.card li{margin:.2rem 0}
.check{list-style:none;padding-left:0 !important}
.check li{display:flex;gap:.5rem}
.check li::before{content:"☐";color:var(--signal);font-family:var(--font-mono)}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:.8rem 1rem;border-radius:0 8px 8px 0;margin-top:1.2rem}
.problem{font-size:1.02rem;border:1px dashed var(--accent);border-radius:8px;padding:1rem 1.2rem;margin-top:1.2rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
.vocab{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.vocab span{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--rule);border-radius:5px;padding:.1rem .45rem;background:var(--sheet)}
.recipe{margin-top:1.6rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.recipe ol{padding-left:1.2rem}
.recipe h3{margin-bottom:.4rem}
h2.groupe-protocoles{margin-top:2.4rem}
span.ch{font-size:.75em;font-weight:400;color:var(--muted, #667)}
.rule-ok{color:var(--ok);font-weight:600}
.rule-no{color:var(--signal);font-weight:600}
pre{font-family:var(--font-mono);font-size:.88rem;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:.9rem 1rem;overflow-x:auto}
footer{margin-top:2rem;font-size:.82rem;color:var(--muted)}

.menu-toggle{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .navwrap{display:none;flex-direction:column;gap:1.2rem}
  .navwrap.open{display:flex}
  .menu-toggle{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent);border:0;padding:.45rem .8rem;border-radius:6px;font-weight:600;font-family:var(--font-body)}
  .steps,.grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.6}to{opacity:1}}
[hidden]{display:none !important}
</style>
</head>
